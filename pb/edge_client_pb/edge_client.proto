syntax = "proto3";

package ziti.edge_client.pb;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/openziti/sdk-golang/v2/pb/edge_client_pb";
option java_package = "org.openziti.edge.proto";

enum ContentType {
  Hello = 0;
  Ping = 1;
  Result = 2;
  Latency = 3;

  // use the same types as xgress uses on links
  XgPayloadType = 1100;
  XgAcknowledgementType = 1101;
  XgControlType = 1102;
  XgCloseType = 1103;

  ConnectType = 60783;
  StateConnectedType = 60784;
  StateClosedType = 60785;
  DataType = 60786;
  DialType = 60787;
  DialSuccessType = 60788;
  DialFailedType = 60789;
  BindType = 60790;
  UnbindType = 60791;
  StateSessionEndedType = 60792;
  ProbeType = 60793;
  UpdateBindType = 60794;
  HealthEventType = 60795;
  TraceRouteType = 60796;
  TraceRouteResponseType = 60797;
  ConnInspectRequest = 60798;
  ConnInspectResponse = 60799;
  BindSuccess = 60800;
  UpdateTokenSuccessType = 60801;
  UpdateTokenFailureType = 60802;
  UpdateTokenType = 60803;

  InspectRequest = 60804;
  InspectResponse = 60805;

  ConnectV2Type = 60806;
  RouteCircuitType = 60807;
  TakeoverCircuitType = 60808;

  PostureResponseType = 10800;
  ServicePostureStateRequestType = 108001;
  ServicePostureStateResponseType = 108002;

  // SDK -> router: opt in to service change push notifications
  SubscribeToServiceUpdatesType     = 10900;
  // SDK -> router: stop receiving service change push notifications
  UnsubscribeFromServiceUpdatesType = 10901;
  // SDK -> router: request a full posture state retransmit after a seq gap
  ResyncPostureStateType            = 10902;
  // router -> SDK: atomic structural changeset (services, policies, posture check defs)
  ServiceChangeSetType              = 10903;
  // router -> SDK: posture pass/fail state for all checks and policies in scope
  PostureStateChangeType            = 10904;
}

enum HeaderId {
  ZER0 = 0;
  UUID = 128;
  ConnId = 1000;
  Seq = 1001;
  SessionToken = 1002;
  PublicKey = 1003;
  Cost = 1004;
  Precedence = 1005;
  TerminatorIdentity = 1006;
  TerminatorIdentitySecret = 1007;
  CallerId = 1008;
  CryptoMethod = 1009;
  Flags = 1010;
  AppData = 1011;
  RouterProvidedConnId = 1012;
  HealthStatus = 1013;
  ErrorCode = 1014;
  Timestamp = 1015;
  TraceHopCount = 1016;
  TraceHopType = 1017;
  TraceHopId = 1018;
  TraceSourceRequestId = 1019;
  TraceError = 1020;
  ListenerId = 1021;
  ConnType = 1022;
  SupportsInspect = 1023;
  // SupportsBindSuccess: legacy boolean flag. The router->SDK advertisement is
  // superseded by RouterCapability_BindSuccess; routers still send this header
  // for pre-capability SDKs. The SDK->router bind-message use of this header is
  // unchanged.
  SupportsBindSuccess = 1024;
  ConnectionMarker = 1025;
  CircuitId = 1026;
  StickinessToken = 1027;
  UseXgressToSdk = 1028;
  XgressCtrlId = 1029;
  XgressAddress = 1030;
  InspectRequestedValues = 1031;
  // SupportsPostureChecks: legacy boolean flag, superseded by
  // RouterCapability_PostureChecks. Routers still send this header for
  // pre-capability SDKs.
  SupportsPostureChecks = 1032;
  StructuredError = 1033;
  DialerIdentityId = 1034;
  DialerIdentityName = 1035;
  ServiceId = 1036;
  ServiceIdentifierType = 1037;
  ConnectRequestId = 1038;
  RouterCapabilities = 1039;
  // RESERVED for the deferred index fast-forward: SDK -> router hello carrying the last committed
  // structural index (-1 = no prior state). Not yet sent by the SDK or read by the router; the
  // initial feature always uses a full snapshot.
  ServiceSubscriptionIndex     = 1040;
  RequestReroutable = 1041;
  RerouteToken = 1042;
  TakeoverResultCode = 1043;
}

enum Error {
  OK = 0;
  Internal = 1;
  InvalidApiSession = 2;
  InvalidSession = 3;
  WrongSessionType = 4;
  InvalidEdgeRouterForSession = 5;
  InvalidService = 6;
  TunnelingNotEnabled = 7;
  InvalidTerminator = 8;
  InvalidPrecedence = 9;
  InvalidCost = 10;
  EncryptionDataMissing = 11;
  InvalidApiSessionType = 12;
  InvalidInstanceId = 13;
  AccessDenied = 14;
  // PostureCheckFailed: policies grant access but their posture checks are failing. The
  // structured error's failingPostureCheckIds carries the failing check ids.
  PostureCheckFailed = 15;
}

enum PrecedenceValue {
  Default = 0;
  Required = 1;
  Failed = 2;
}

// RouterCapability wraps the router capability enum. The enum values are bit
// positions within a single router capability namespace shared across the
// control channel and the edge channel. A router advertises the full set on both
// channels; each consumer acts on the bits it recognizes and ignores the rest.
//
// This enum is the source of truth for capabilities that the SDK cares about.
// These are numbered upward from bit 1; add a shared capability at the next
// unused position.
//
// Note: the ziti controller/router may also define control-plane-only
// capabilities that are NOT listed here (see ziti/common/capabilities/consts.go
// in the ziti repo). Those are given negative values that occupy bit positions
// counting down from the top of the mask, so they never collide with the values
// here and will appear to SDKs and the edge-api as unknown bits, which is
// expected.
//
// The enum is nested in a message so its value names are scoped to
// RouterCapability and cannot collide with other enum values in this package
// (proto enum values otherwise share one package-wide namespace). Generated Go
// value names are unchanged (e.g. RouterCapability_MultiChannel); only the enum
// type name becomes RouterCapability_Kind.
message RouterCapability {
  enum Kind {
    NoRouterCapabilities = 0;
    // MultiChannel indicates the router supports multi-underlay channels
    MultiChannel = 1;
    // ConnectV2 indicates the router supports the ConnectV2 message flow
    ConnectV2 = 2;
    // 3 was RouterDataModel, moved to a side-local (negative) capability position: it is only
    // meaningful between controller and router and needs no name on the SDK surface.
    reserved 3;
    // ServiceSubscriptions indicates the router supports service change push subscriptions
    ServiceSubscriptions = 4;
    // PostureChecks indicates the router supports posture checks. Also advertised
    // to older SDKs via the deprecated SupportsPostureChecks header.
    PostureChecks = 5;
    // BindSuccess indicates the router sends bind-success notifications. Also
    // advertised to older SDKs via the deprecated SupportsBindSuccess header.
    BindSuccess = 6;
    // SDKReroute indicates the router supports SDK-driven circuit reroute (takeover)
    SDKReroute = 7;
  }
}

// TakeoverResult is the disposition of a TakeoverCircuit attempt, carried in the
// TakeoverResultCode header of the reply. The proto3 zero value is unspecified and MUST be
// treated as a fatal abort, never as success.
enum TakeoverResult {
  TakeoverResultUnspecified = 0;
  TakeoverSuccess = 1;
  // TakeoverOwnerUnreachable: the router has no channel to the owning controller (retryable)
  TakeoverOwnerUnreachable = 2;
  // TakeoverBusy: a concurrent mutation held the circuit's CAS guard (retryable)
  TakeoverBusy = 3;
  // TakeoverRouteInstallFailed: new-path install failed and was rolled back (retryable)
  TakeoverRouteInstallFailed = 4;
  // TakeoverTokenRejected: bad signature, identity mismatch, stale iteration, or authz denied (fatal)
  TakeoverTokenRejected = 5;
  // TakeoverNotReroutable: circuit exists but is not in a reroutable/Limbo state (fatal)
  TakeoverNotReroutable = 6;
  // TakeoverNotFound: circuit is gone (grace expired or removed) (fatal)
  TakeoverNotFound = 7;
}

enum Flag {
  ZERO = 0;

  // FIN is an edge payload flag used to signal communication ends
  FIN = 1;
  // TRACE_UUID indicates that peer will send data messages with specially constructed UUID headers
  TRACE_UUID = 2;
  // MULTIPART indicates that peer can accept multipart data messages
  MULTIPART = 4;
  // STREAM indicates connection with stream semantics
  // this allows consolidation of payloads to lower overhead
  STREAM = 8;
  // MULTIPART_MSG set on data message with multiple payloads
  MULTIPART_MSG = 16;
}

message ServicePostureStateRequest {
  repeated string serviceIds = 1;
}

message ServicePostureStateResponse {
  map<string, ServicePostureState> states = 1;
}

message ServicePostureState {
  bool isPassing = 1;
  repeated string passingPolicyIds = 2;
  repeated string failingPolicyIds = 3;
  map<string, Policy> policies = 4;
}

message Policy {
  string id = 1;
  bool isPassing = 2;
  repeated string passingPostureQueryIds = 3;
  repeated string failingPostureQueryIds = 4;
  map<string, PostureQuery> postureQueries = 5;
}

message PostureQuery {
  string id = 1;
  string type = 2;
  bool isPassing = 3;

  google.protobuf.Timestamp timeoutAt = 4;
  int32 timeoutSeconds = 5;
  int32 timeoutRemainingSeconds = 6;

  int32 promptGracePeriodSeconds = 7;
  bool promptOnUnlock = 8;
  bool promptOnWake = 9;

  Processes processes = 10;

  message Processes {
    string semantic = 1;
    repeated Process processes = 2;
  }

  message Process {
    string osType = 1;
    string path = 2;
  }
}

message PostureResponses {
  repeated PostureResponse responses = 1;
}

message PostureResponse {
  oneof Type {
    Macs macs = 1;
    OperatingSystem os = 2;
    ProcessList processList = 3;
    Domain domain = 4;
    Woken woken = 5;
    Unlocked unlocked = 6;
    SdkInfo sdkInfo = 7;
    TotpToken totpToken = 8;
  };

  message TotpToken {
    string token = 1;
    string code = 2;
  }


  message Macs {
    repeated string addresses = 1;
  }

  message OperatingSystem {
    string type = 1;
    string version = 2;
    string build = 3;
  }

  message Domain {
    string name = 1;
  }

  message Process {
    string path = 1;
    bool isRunning = 2;
    string hash = 3;
    repeated string signerFingerprints = 4;
  }

  message ProcessList {
    repeated Process processes = 1;
  }

  message Woken {
    google.protobuf.Timestamp Time = 1;
  }

  message Unlocked {
    google.protobuf.Timestamp Time = 1;
  }

  message SdkInfo {
    string appId = 1;
    string appVersion = 2;
    string branch = 3;
    string revision = 4;
    string type = 5;
    string version = 6;
  }
}

// Op is the change operation for a structural entry in a ServiceChangeSet.
enum Op {
  Added   = 0;
  Updated = 1;
  Removed = 2;
}

// PolicyType distinguishes dial-access policies from bind-access policies.
enum PolicyType {
  Dial = 0;
  Bind = 1;
}

// SubscribeToServiceUpdates is sent by the SDK to start receiving service change push notifications.
// index is RESERVED for the deferred fast-forward (last committed structural index); the SDK
// currently always sends -1 and the router treats every value as a full-snapshot request.
message SubscribeToServiceUpdates {
  int64 index = 1;
}

// UnsubscribeFromServiceUpdates is sent by the SDK to stop receiving service change push notifications.
message UnsubscribeFromServiceUpdates {
}

// ResyncPostureState is sent by the SDK when it detects a gap in PostureStateChange seq values.
// The router replies with a full PostureStateChange at the next seq.
message ResyncPostureState {
}

// ServiceChangeSet is an atomic structural changeset mirroring the RDM DataState_ChangeSet envelope.
// The SDK applies the whole message atomically and commits index on receipt.
// previousIndex == -1 means full reset (clear structural cache, apply all Added entries).
// On an incremental: if previousIndex != committedIndex the SDK must resubscribe at -1.
message ServiceChangeSet {
  int64                    index         = 1;
  int64                    previousIndex = 2;
  repeated ServiceDef      services      = 3;
  repeated PolicyDef       policies      = 4;
  repeated PostureCheckDef postureChecks = 5;
}

// ServiceDef describes one service in a ServiceChangeSet.
// policyIds references PolicyDef entries in the same envelope or already known to the SDK.
// configData carries the resolved config bodies for the subscribing identity, already merged
// with that identity's per-service config overrides.
// Removed entries carry id only; all other fields are empty.
message ServiceDef {
  Op                  op                 = 1;
  string              id                 = 2;
  string              name               = 3;
  bool                encryptionRequired = 4;
  repeated string     configs            = 5;
  repeated string     policyIds          = 6;
  repeated ConfigData configData         = 7;
}

// ConfigData is one resolved config body for a service, scoped to the subscribing identity.
message ConfigData {
  string typeId   = 1;
  string typeName = 2;
  string dataJson = 3;
}

// PolicyDef describes one service policy (dial or bind) in a ServiceChangeSet.
// postureCheckIds references PostureCheckDef entries in the same envelope or already known to the SDK.
message PolicyDef {
  Op              op              = 1;
  string          id              = 2;
  PolicyType      type            = 3;
  repeated string postureCheckIds = 4;
}

// PostureCheckDef describes one posture check definition in a ServiceChangeSet.
// Only the fields relevant to the check type are populated.
message PostureCheckDef {
  Op     op   = 1;
  string id   = 2;
  // type is one of: MFA, PROCESS_MULTI, OS, MAC, DOMAIN
  string type = 3;

  // MFA prompt configuration
  int32 promptGracePeriodSeconds = 4;
  bool  promptOnUnlock           = 5;
  bool  promptOnWake             = 6;
  // timeoutSeconds is the MFA timeout; -1 when the check never times out. 0 means the sender
  // predates this field and the timeout is unknown.
  int64 timeoutSeconds           = 9;

  // PROCESS_MULTI configuration
  string           semantic  = 7;
  repeated Process processes = 8;

  message Process {
    string osType = 1;
    string path   = 2;
  }
}

// PostureStateChange carries the current posture pass/fail state for all checks and policies
// in scope for this connection. Sent full on subscribe; sent as a delta of affected entries
// on subsequent posture-data changes. Not indexed — recovered via ResyncPostureState on seq gap.
message PostureStateChange {
  // seq is a per-connection monotonic counter starting at 1. Reset on reconnect.
  uint64 seq = 1;
  // structuralIndex is the router's RDM index the posture evaluation ran against, for logging and
  // correlation only — it is the GLOBAL RDM index, while a connection's ServiceChangeSet chain
  // advances only when its own identity's services change, so it is NOT usable as a delivery gate
  // against the SDK's committed structural index. Apply the state on receipt; ids not yet known
  // structurally are attached when their definitions arrive.
  uint64 structuralIndex = 2;
  // 3 was postureDataVersion, removed before release: never populated and never read.
  reserved 3;
  reserved "postureDataVersion";
  // generatedAt is a human-readable log aid only; never used for ordering or dedup.
  google.protobuf.Timestamp generatedAt = 4;

  repeated CheckState  checkStates  = 5;
  repeated PolicyState policyStates = 6;

  // CheckState holds the current pass/fail state for one posture check.
  // timeoutAt and timeoutRemainingSeconds are only set for checks with an active timeout (e.g. MFA).
  message CheckState {
    string                    checkId                 = 1;
    bool                      isPassing               = 2;
    google.protobuf.Timestamp timeoutAt               = 3;
    int32                     timeoutRemainingSeconds = 4;
  }

  // PolicyState holds the current pass/fail state for one service policy.
  message PolicyState {
    string policyId  = 1;
    bool   isPassing = 2;
  }
}
