name: acceptance

# SDK acceptance suite: runs the SDK under test against real, versioned OpenZiti
# controllers/routers. See acceptance/README.md for local usage.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compatibility matrix. Each entry is a selector resolved at run time, never a
  # hardcoded version: active-lts and maint-lts are labels defined in the version
  # manifest (acceptance/versions.yaml), latest is the highest published release,
  # and main is ziti's mainline built from source. These jobs run adaptively:
  # each probes ConnectV2 capability, expects the path the negotiation inputs
  # dictate, and asserts compatibility. Together they guarantee V1 compatibility
  # across the matrix. The released selectors download a binary; main builds from
  # source.
  compat:
    strategy:
      fail-fast: false
      matrix:
        version:
          - active-lts
          - maint-lts
          - latest
          - main
    runs-on: ubuntu-latest
    env:
      ZITI_ACCEPTANCE_VERSION: ${{ matrix.version }}
      # in-workspace so the binary cache below can persist it
      ZITI_ACCEPTANCE_CACHE: ${{ github.workspace }}/.ziti-acceptance-cache
      # authenticated release/clone API access avoids the 60/hr anonymous limit
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: acceptance/go.sum

      # Cached on the immutable id (release tag or source SHA) embedded in each
      # binary's filename, so a moved selector misses rather than serving stale.
      # versions.yaml is in the key so editing the matrix invalidates downloads.
      - name: Cache ziti binaries
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ziti-acceptance-cache
          key: ziti-acceptance-${{ runner.os }}-${{ matrix.version }}-${{ hashFiles('acceptance/versions.yaml') }}
          restore-keys: |
            ziti-acceptance-${{ runner.os }}-${{ matrix.version }}-

      - name: Run acceptance suite
        working-directory: acceptance
        run: go test -tags acceptance -p 1 -timeout 30m ./...

  # Designated V2-coverage job. The V1/V2 tests are runtime-adaptive, so the
  # compat jobs can validly expect V1 and pass; nothing there guarantees the
  # suite actually exercises V2 + OIDC, which is connect-v2's core risk. This job
  # builds the connect-v2 ziti branch from source against the SDK under test
  # (co-development build) and runs in required mode: it FAILS if ConnectV2
  # router capability or headless OIDC is absent, with no adaptive downgrade to a
  # V1 pass. Using the branch (not a pinned SHA) means it tracks HEAD and can't
  # go stale; it resolves to a concrete SHA before the cache lookup.
  # TODO: once connect-v2 lands on main, point this at `main` (and at the
  #       shipping release once it ships), and drop the co-development build.
  #
  # GATED: disabled until ziti adopts channel/v5. The SDK is on channel/v5 (the
  # 2.0 line), and ziti shares the sdk-golang/xgress package, so ziti must be on
  # channel/v5 for this co-development build to compile. ziti's channel/v5
  # migration is in progress (the openziti/ziti `channel-v5` branch) but not yet
  # on main or merged with connect-v2. Re-enable by removing the `if: false`
  # below once ziti connect-v2 builds on channel/v5 + sdk-golang/v2.
  connect-v2:
    if: false
    runs-on: ubuntu-latest
    env:
      ZITI_ACCEPTANCE_VERSION: connect-v2
      # the connect-v2 ziti branch co-develops with the SDK; build it against the
      # SDK under test rather than its pinned (local-replace) sdk-golang
      ZITI_ACCEPTANCE_BUILD_WITH_LOCAL_SDK: "true"
      # require genuine V2 coverage: no silent fallback to a V1 pass
      ZITI_ACCEPTANCE_REQUIRE_V2: "true"
      ZITI_ACCEPTANCE_CACHE: ${{ github.workspace }}/.ziti-acceptance-cache
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: acceptance/go.sum

      # The co-development binary is keyed on the ziti SHA plus the SDK commit, so
      # it caches per (connect-v2 HEAD, SDK commit) pair. A clean CI checkout is
      # never dirty, so the build is cacheable; a new SDK commit rebuilds ziti.
      - name: Cache ziti binaries
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ziti-acceptance-cache
          key: ziti-acceptance-${{ runner.os }}-connect-v2-${{ github.sha }}
          restore-keys: |
            ziti-acceptance-${{ runner.os }}-connect-v2-

      - name: Run V2 coverage (required mode)
        working-directory: acceptance
        run: go test -tags acceptance -p 1 -timeout 30m ./...
